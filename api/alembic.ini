# Alembic configuration file for EdgeTwin AI database migrations

[alembic]
# Path to migration scripts
script_location = api/migrations

# Path separator for multi-path options
path_separator = os

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path configuration
prepend_sys_path = .

# Timezone
timezone = UTC

# Max length of characters for slug
truncate_slug_length = 40

# Version locations
version_locations = api/migrations/versions

# Output encoding
output_encoding = utf-8

sqlalchemy.url = postgresql+psycopg2://edgetwin:edgetwin_dev_secret@localhost:5432/edgetwin

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
