[project]
name = "edgetwin"
version = "0.1.0"
description = "EdgeTwin AI - Predictive Maintenance"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "mlflow>=3.0,<4",
    "xgboost>=3.0,<4",
    "shap>=0.48.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "black==26.5.1",
    "pre-commit==4.6.2",
    "mypy==2.3.1",
    "dvc>=3.0,<4",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
exclude = [
    "notebooks/*",
    "data/*"
]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
  | notebooks
  | data
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
