[project]
name = "edgetwin"
version = "0.1.0"
description = "EdgeTwin AI - Predictive Maintenance"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn==1.6.1",
    "mlflow>=3.0,<4",
    "xgboost>=3.0,<4",
    "shap>=0.48.0,<1",
    "jsonschema[format-nongpl]>=4.20,<5",
    "rfc3339-validator>=0.1.4",
    "pyyaml>=6.0,<7",
    "paho-mqtt>=2.0.0,<3",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
    "pydantic>=2.8.0,<3",
    "pydantic-settings>=2.5.0,<3",
    "sqlalchemy>=2.0.0,<3",
    "alembic>=1.13.0,<2",
    "psycopg2-binary>=2.9.9,<3",
    "bcrypt>=4.0,<5",
    "pyjwt>=2.8.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "black==26.5.1",
    "pre-commit==4.6.2",
    "mypy==2.3.1",
    "dvc>=3.0,<4",
    "httpx>=0.27.0,<1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
exclude = [
    "notebooks/*",
    "data/*"
]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    notebooks
    | data
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
