scenario_id: SCN-07-SENSOR-DROPOUT
name: Sensor Dropout & Degradation
description: Intermittent missing sensor values demonstrating native NaN handling and MISSING quality flags.
machine_id: MOT-1001
duration_steps: 90
tick_interval_s: 1.0
seed: 42

baseline:
  air_temp_c:
    mean: 25.4
    std: 0.5
  process_temp_c:
    mean: 35.3
    std: 0.6
  rotational_speed_rpm:
    mean: 1548.0
    std: 20.0
  torque_nm:
    mean: 40.1
    std: 2.0
  vibration_mm_s:
    mean: 2.5
    std: 0.3
  pressure_bar:
    mean: 5.5
    std: 0.4
  current_a:
    mean: 12.0
    std: 0.5
  voltage_v:
    mean: 415.0
    std: 2.0
  tool_wear_min: 50.0
  tool_wear_rate: 0.1
  operating_hours: 10000.0

fault:
  type: dropout
  dropouts:
    - sensor: vibration_mm_s
      start_step: 20
      end_step: 50
    - sensor: pressure_bar
      start_step: 35
      end_step: 65

acceptance_targets:
  expected_risk_band: LOW
  max_calibrated_probability: 0.15
  expected_health_state: WARNING
