  process_temp_c:
    mean: 35.3
    std: 0.6
  rotational_speed_rpm:
    mean: 1548.0
    std: 20.0
  torque_nm:
    mean: 40.1
    std: 2.0
  vibration_mm_s:
    mean: 2.5
    std: 0.3
  pressure_bar:
    mean: 5.5
    std: 0.4
  current_a:
    mean: 12.0
    std: 0.5
