name: EdgeTwin AI CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Code Formatter Check
        run: black --check .

  firmware-native:
    name: Native C++ Firmware Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify g++ compiler
        run: g++ --version

      - name: Compile Native Edge Harness
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra \
            -Iedge \
            -Itests/edge \
            -Itests/edge/arduino_compat \
            tests/edge/test_native_edge.cpp \
            edge/process_model.cpp \
            edge/ring_buffer.cpp \
            edge/command.cpp \
            edge/telemetry.cpp \
            -o test_native_edge

      - name: Execute Native Firmware Unit Tests
        run: ./test_native_edge

  test-suite:
    name: Python Unit, Contract & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, firmware-native]
    env:
      MLFLOW_SKIP_PIP_REQUIREMENTS_CHECK: "true"
      SECRET_KEY: "ci-test-secret-key-for-jwt-signing-deterministic"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Project & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install -r requirements.txt pytest pytest-asyncio

      - name: Run Full Pytest Suite
        run: pytest -v

      - name: Run Automated Simulation Runner
        run: python simulation/wokwi_runner.py --json

  wokwi-simulation:
    name: Wokwi Hardware Simulation (Emulated)
    runs-on: ubuntu-latest
    needs: [firmware-native]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Evaluate Wokwi Simulation Prerequisites
        id: check_token
        run: |
          if [ -n "${{ secrets.WOKWI_CLI_TOKEN }}" ]; then
            echo "token_present=true" >> $GITHUB_OUTPUT
          else
            echo "token_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Wokwi Simulation via CLI
        if: steps.check_token.outputs.token_present == 'true'
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: edge
          timeout: 30000
          expect_text: "edgetwin.telemetry.v1"

      - name: Report Missing Wokwi Token Notice
        if: steps.check_token.outputs.token_present != 'true'
        run: |
          echo "::notice title=Wokwi Cloud Simulation Skipped::WOKWI_CLI_TOKEN secret is not configured in repository secrets. Live cloud Wokwi emulation skipped; deterministic edge verification is guaranteed via native C++ test suite and contract tests."
